<title>Nesting Depth Parity CSS</title>
<style>
body {
	font: 1rem sans-serif;
}

div {
	--borderSize: 0.25rem;
	--bgColor: #1e2226;
	--evenodd: odd;
	--gapSize: 1rem;
	background: if(
		style(--evenodd: odd): oklch(from var(--bgColor) 0.96 c h);
		else: oklch(from var(--bgColor) 0.93 c h);
	);
	border-inline-start: var(--borderSize) solid #135;
	border-radius: var(--borderSize);
	margin-block: var(--gapSize);
	margin-inline: 0;
	padding-block: var(--gapSize);
	padding-inline: calc(var(--gapSize) * 1.5);

	@container style(--evenodd: odd) {
		--evenodd: even;
	}
}
</style>
